<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">whisper-gpu-kit</title>
  <desc id="d">whisper-gpu-kit: faster-whisper on the GPU, with a CPU fallback when VRAM runs out and no re-download when the error is really CUDA. Right: the log of one transcribe_with_fallback call where the GPU runs out of memory and the file is redone on CPU.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, "Noto Sans", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  </style>
  <rect width="1200" height="420" rx="20" fill="#121417"/>

  <g id="title-block">
    <text x="60" y="84" class="mono" font-size="19" letter-spacing="1.5" fill="#9AA0A8">FASTER-WHISPER · CUDA 12 · PYTHON 3.12+</text>
    <text x="56" y="158" class="sans" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#E6E7EA">whisper-gpu-kit</text>
    <text x="60" y="212" class="sans" font-size="27" font-weight="600" fill="#E6E7EA">Run Whisper on the GPU.</text>
    <text x="60" y="248" class="sans" font-size="27" fill="#9AA0A8">Finish on the CPU when VRAM runs out.</text>
    <text x="60" y="284" class="sans" font-size="27" fill="#9AA0A8">Download the model only when it is missing.</text>

    <!-- device route: cuda fails, cpu finishes -->
    <g class="mono" font-size="20">
      <rect x="60" y="322" width="176" height="52" rx="10" fill="none" stroke="#E6E7EA" stroke-width="2"/>
      <text x="148" y="355" text-anchor="middle" fill="#E6E7EA">cuda float16</text>
      <path d="M244 348 H384" stroke="#F0A35A" stroke-width="3" stroke-dasharray="7 6"/>
      <path d="M304 338 l20 20 M324 338 l-20 20" stroke="#F0A35A" stroke-width="3" stroke-linecap="round"/>
      <path d="M392 348 l-14 -9 v18 z" fill="#F0A35A"/>
      <rect x="400" y="322" width="148" height="52" rx="10" fill="#6CC48F"/>
      <text x="474" y="355" text-anchor="middle" fill="#121417">cpu int8</text>
    </g>
  </g>

  <g id="project-proof">
    <rect x="620" y="36" width="540" height="348" rx="14" fill="#1C1F24" stroke="#30353B" stroke-width="2"/>
    <text x="648" y="76" class="mono" font-size="17" letter-spacing="1" fill="#9AA0A8">transcribe_with_fallback(audio)</text>
    <g class="mono" font-size="18">
      <text x="648" y="118" fill="#E6E7EA">Loading faster-whisper large-v3 on cuda…</text>
      <text x="648" y="146" fill="#E6E7EA">Whisper model ready (cuda).</text>
      <rect x="636" y="162" width="4" height="84" fill="#F0A35A"/>
      <text x="648" y="182" fill="#F0A35A">GPU transcription failed (CUDA failed</text>
      <text x="648" y="210" fill="#F0A35A">with error out of memory). … Falling</text>
      <text x="648" y="238" fill="#F0A35A">back to CPU — slower; free VRAM and …</text>
      <text x="648" y="274" fill="#E6E7EA">Loading faster-whisper large-v3 on cpu…</text>
      <text x="648" y="302" fill="#E6E7EA">Whisper model ready (cpu).</text>
      <text x="648" y="348" fill="#6CC48F">→ ('Hello and welcome back.', 'en', 'cpu')</text>
    </g>
  </g>
</svg>
